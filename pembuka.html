<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookStore</title>
  <link rel="stylesheet" href="css/splash.css?rev1012">
</head>
<body class="splash-page">
  <div class="splash-stage" id="splashStage">
    <div class="splash-glow splash-glow-left" aria-hidden="true"></div>
    <div class="splash-glow splash-glow-right" aria-hidden="true"></div>

    <!-- Judul bagian -->
    <header class="splash-brand-bar">
      <span>USK BookStore</span>
      <span>Online Library</span>
    </header>

    <!-- Isi utama halaman -->
    <main class="splash-center">
      <div class="splash-logo-wrap">
        <span class="splash-ring" aria-hidden="true"></span>
        <img class="splash-logo" src="assets/logo.png" alt="BookStore">
      </div>
      <p class="splash-kicker">Welcome</p>
      <h1>BookStore</h1>
      <p class="splash-tagline">Temukan buku favoritmu. Koleksi siap ditampilkan...</p>
      <div class="splash-progress" aria-hidden="true"><span></span></div>
      <p class="splash-status" id="splashStatus">Menyiapkan koleksi...</p>
    </main>

    <!-- Bagian bawah halaman -->
    <footer class="splash-footer">
      <span>Loading</span>
      <span>2026</span>
    </footer>
  </div>

  <!-- Skrip halaman -->
  <script src="js/splash.js?rev1012"></script>
</body>
</html>
