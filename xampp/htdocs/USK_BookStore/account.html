<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akun - BookStore</title>
  <link rel="stylesheet" href="css/style.css?rev1010">
  <link rel="stylesheet" href="css/account.css?rev1041">
  <link rel="stylesheet" href="css/review.css?rev1010">
</head>
<body class="account-page">
  <div class="app-shell account-shell">
    <aside class="sidebar">
      <div class="sidebar-avatar active-account" id="sidebarAvatar" title="Akun">SA</div>
      <nav class="sidebar-nav">
        <button class="nav-item" type="button" onclick="location.href='user.html'" title="Beranda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
        </button>
        <button class="nav-item active" type="button" title="Akun">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </nav>
    </aside>

    <main class="main-content account-main">
      <header class="account-header">
        <div class="account-header-copy">
          <button type="button" class="breadcrumb-back" id="backBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            Kembali
          </button>
          <h1>Akun</h1>
        </div>
        <p class="account-header-note">Kelola profil, pesanan, dan preferensi belanja Anda di satu tempat.</p>
      </header>

      <div class="account-layout">
        <aside class="account-menu-panel">
          <div class="account-profile">
            <div class="account-avatar-wrap">
              <button type="button" class="account-avatar" id="profileAvatar" aria-label="Ubah foto profil"></button>
              <span class="account-avatar-edit" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </span>
              <input type="file" id="profilePhotoInput" accept="image/*" hidden>
            </div>
            <div class="account-photo-actions">
              <button type="button" class="btn btn-secondary btn-sm" id="changePhotoBtn">Pilih Foto</button>
              <button type="button" class="btn btn-secondary btn-sm hidden" id="removePhotoBtn">Hapus Foto</button>
            </div>
            <h2 id="profileName">User</h2>
            <p id="profileEmail">user@gmail.com</p>
            <span class="account-member-badge">Anggota BookStore</span>
            <p class="account-balance" id="profileBalance">Saldo pengembalian Rp 0</p>
          </div>

          <nav class="account-menu" id="accountMenu">
            <button type="button" class="account-menu-item active" data-section="orders">
              <span class="account-menu-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              </span>
              Pesanan Saya
            </button>
            <button type="button" class="account-menu-item" data-section="wishlist">
              <span class="account-menu-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              </span>
              Wishlist
            </button>
            <button type="button" class="account-menu-item" data-section="address">
              <span class="account-menu-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              </span>
              Alamat Pengiriman
            </button>
            <button type="button" class="account-menu-item" data-section="payment">
              <span class="account-menu-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
              </span>
              Metode Pembayaran
            </button>
            <div class="account-menu-divider"></div>
            <button type="button" class="account-menu-item" data-section="about">
              <span class="account-menu-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              </span>
              Tentang Aplikasi
            </button>
            <button type="button" class="account-menu-item account-logout" id="logoutBtn">
              <span class="account-menu-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              </span>
              Keluar
            </button>
          </nav>
        </aside>

        <section class="account-content-panel" id="accountContent"></section>
      </div>
    </main>
  </div>

  <script src="js/auth.js?rev1045"></script>
  <script src="js/data.js?rev1045"></script>
  <script src="js/book-card.js?rev1010"></script>
  <script src="js/review-ui.js?rev1039"></script>
  <script src="js/account-page.js?rev1045"></script>
</body>
</html>
