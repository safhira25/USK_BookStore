  Deskripsi: Beranda pengguna setelah masuk.
-->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda - BookStore</title>
  <link rel="stylesheet" href="css/style.css?rev1010">
  <link rel="stylesheet" href="css/chat.css?rev1010">
  <link rel="stylesheet" href="css/review.css?rev1010">
</head>
<body>
  <div class="app-shell">
    <!-- Menu samping -->
    <aside class="sidebar">
      <div class="sidebar-avatar" id="userAvatar" title="Profil Akun" role="button" tabindex="0">SA</div>
      <nav class="sidebar-nav">
        <button class="nav-item active" type="button" title="Beranda" aria-label="Beranda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
        </button>
        <button class="nav-item" id="loveNavBtn" title="Love" aria-label="Love" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </nav>
    </aside>

    <!-- Isi utama halaman -->
    <main class="main-content">
      <div class="welcome-banner">
        <div class="welcome-text">
          <p class="welcome-greeting">Selamat datang kembali,</p>
          <h1 id="welcomeName">Pembaca</h1>
          <p class="welcome-desc">Temukan buku favoritmu dan nikmati pengalaman belanja yang nyaman.</p>
        </div>
        <div class="welcome-stats">
          <div class="welcome-stat">
            <span class="welcome-stat-value" id="statBooksCount">0</span>
            <span class="welcome-stat-label">Buku Tersedia</span>
          </div>
          <div class="welcome-stat">
            <span class="welcome-stat-value" id="statCartCount">0</span>
            <span class="welcome-stat-label">Di Keranjang</span>
          </div>
        </div>
      </div>

      <div class="top-bar">
        <div class="search-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Cari judul, penulis, atau kategori...">
          <button class="btn btn-gradient btn-sm" id="searchBtn" type="button">Cari</button>
        </div>
        <button class="cart-btn" id="cartBtn" title="Keranjang Belanja" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge" id="cartBadge">0</span>
        </button>
        <div class="user-menu">
          <span id="userName"></span>
          <button class="logout-btn" type="button" onclick="logout()">Keluar</button>
        </div>
      </div>

      <div class="categories" id="categories"></div>

      <div class="section-header">
        <div>
          <h2 id="sectionTitle">Populer</h2>
          <p class="section-subtitle" id="sectionSubtitle">Buku pilihan terbaik untukmu hari ini</p>
        </div>
        <div class="section-actions">
          <a href="#" id="viewAllLink">Lihat Semua</a>
          <button class="arrow-btn" id="prevBtn" type="button" aria-label="Sebelumnya">&lsaquo;</button>
          <button class="arrow-btn" id="nextBtn" type="button" aria-label="Berikutnya">&rsaquo;</button>
        </div>
      </div>

      <div class="book-scroll-wrap">
        <div class="book-grid" id="bookGrid"></div>
      </div>
    </main>

    <!-- Panel percakapan dengan admin -->
    <aside class="chat-panel" id="chatPanel">
      <div class="chat-header">
        <button class="chat-close" id="chatClose" type="button" aria-label="Tutup chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <div class="chat-peer">
          <div class="chat-peer-avatar">AD</div>
          <div>
            <h3>Admin BookStore</h3>
            <p class="chat-status"><span class="chat-status-dot"></span> Online • Siap membantu</p>
          </div>
        </div>
        <button class="chat-clear" id="chatClear" type="button" aria-label="Hapus riwayat chat" title="Hapus riwayat chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18"/>
            <path d="M8 6V4h8v2"/>
            <path d="m19 6-1 14H6L5 6"/>
            <path d="M10 11v5M14 11v5"/>
          </svg>
        </button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-quick" id="chatQuick">
        <button type="button" data-msg="Halo admin, saya ingin cek status pesanan saya.">Status pesanan</button>
        <button type="button" data-msg="Halo admin, saya ingin mengajukan pengembalian buku.">Pengembalian</button>
        <button type="button" data-msg="Halo admin, saya butuh bantuan terkait akun.">Bantuan akun</button>
      </div>
      <form class="chat-input-wrap" id="chatForm">
        <input type="text" id="chatInput" placeholder="Tulis pesan ke admin..." autocomplete="off">
        <button class="chat-send" id="chatSend" type="submit" aria-label="Kirim pesan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
    </aside>
  </div>

  <button class="chat-fab" id="chatFab" type="button" aria-label="Buka chat admin">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v16l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
    </svg>
  </button>

  <!-- Skrip halaman -->
  <script src="js/auth.js?rev1010"></script>
  <script src="js/data.js?rev1010"></script>
  <script src="js/book-card.js?rev1010"></script>
  <script src="js/chat.js?rev1010"></script>
  <script src="js/review-ui.js?rev1010"></script>
  <script src="js/user.js?rev1010"></script>
</body>
</html>
