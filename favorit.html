<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Pengaturan karakter, tampilan responsif, judul, dan stylesheet halaman. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love - BookStore</title>
  <link rel="stylesheet" href="css/style.css?rev1010">
</head>
<body class="love-page">
  <!-- Kerangka aplikasi yang membungkus navigasi samping dan konten utama. -->
  <div class="app-shell love-shell">
    <!-- Navigasi samping untuk akses akun dan halaman utama. -->
    <aside class="sidebar">
      <div class="sidebar-avatar" id="sidebarAvatar" title="Akun">SA</div>
      <nav class="sidebar-nav">
        <!-- Tombol untuk kembali ke halaman beranda pengguna. -->
        <button class="nav-item" type="button" onclick="location.href='pengguna.html'" title="Beranda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
        </button>
        <!-- Penanda navigasi bahwa halaman daftar buku favorit sedang aktif. -->
        <button class="nav-item active" type="button" title="Love">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </nav>
    </aside>

    <!-- Konten utama halaman buku yang disukai. -->
    <main class="main-content love-main">
      <!-- Judul halaman, keterangan, dan tombol kembali. -->
      <header class="love-header">
        <button type="button" class="breadcrumb-back" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Kembali
        </button>
        <div>
          <h1>Love</h1>
          <p class="love-subtitle">Buku yang kamu sukai</p>
        </div>
      </header>

      <!-- Area tempat daftar buku favorit ditampilkan oleh JavaScript. -->
      <div class="love-grid" id="loveContent"></div>
    </main>
  </div>

  <!-- Memuat autentikasi, data buku, komponen kartu buku, dan logika halaman Love. -->
  <script src="js/auth.js?rev1010"></script>
  <script src="js/data.js?rev1010"></script>
  <script src="js/book-card.js?rev1010"></script>
  <script src="js/love-page.js?rev1010"></script>
