<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metode Pembayaran - BookStore</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="css/style.css?v=1034">
</head>
<body class="payment-page">
  <div class="app-shell payment-shell" id="appShell">
    <aside class="sidebar" id="paymentSidebar"></aside>

    <main class="main-content payment-main">
      <header class="payment-header">
        <button type="button" class="breadcrumb-back" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Kembali
        </button>
        <h1>Metode Pembayaran</h1>
      </header>

      <div id="paymentContent" class="payment-grid"></div>

      <div id="paymentError" class="detail-error hidden">
        <div class="detail-error-box">
          <h2>Pesanan tidak valid</h2>
          <p>Silakan pilih buku terlebih dahulu.</p>
          <button class="btn btn-primary btn-sm" id="errorBackBtn" type="button">Kembali ke Beranda</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/auth.js?v=1045"></script>
  <script src="js/data.js?v=1045"></script>
  <script src="js/payment-page.js?v=1034"></script>
</body>
</html>
